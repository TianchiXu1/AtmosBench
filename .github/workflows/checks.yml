name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r code/requirements.txt
      - run: python atmosbench/verify_dataset.py --metadata-only
      - run: python -m unittest discover -s tests
      - run: python code/scripts/reproduce_tables.py --output "$RUNNER_TEMP/atmosbench-reproduced-results"
